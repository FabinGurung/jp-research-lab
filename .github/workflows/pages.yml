name: Deploy JP R&D control portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jp-rd-control-portal-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pinned native scheduling kernel for Fabin experiment
        uses: actions/checkout@v4
        with:
          repository: FabinGurung/jp-scheduling-resources-management
          ref: 49f69e76a85eec9737f704691cc69c88aad62818
          path: peers/scheduling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline Three.js modules
        run: npm install --no-save --no-package-lock --ignore-scripts three@0.164.1
      - name: Read the two linked synthetic Google sources
        run: python experiments/fabin-four-workflows/sync_google.py
      - name: Verify the synthetic four-workflow calculation
        run: python -m unittest discover -s experiments/fabin-four-workflows -p 'test_*.py' -v
      - run: python scripts/validate_repo.py
      - run: python scripts/test_site_links.py
      - run: python scripts/build_site.py --out dist
        env:
          FABIN_SCHEDULING_CHECKOUT: ${{ github.workspace }}/peers/scheduling
      - name: Assemble private modular LaTeX from the live academic Doc
        run: |
          python experiments/fabin-four-workflows/latex.py --academic /tmp/fabin-experiment-private/academic.json --results dist/researchers/fabin-gurung/experiments/four-workflows/results.json --out /tmp/fabin-experiment-private/latex
          python scripts/latex/check_modular_project.py /tmp/fabin-experiment-private/latex
      - name: Install the registered Google Drive source gallery
        run: python3 .github/source-gallery/install.py dist jp-research-lab
      - run: python scripts/validate_repo.py --site dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy main only
        id: deployment
        uses: actions/deploy-pages@v4
