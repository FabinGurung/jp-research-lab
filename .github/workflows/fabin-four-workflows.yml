name: Fabin four-workflow experiment
on:
  pull_request:
    paths: ['experiments/fabin-four-workflows/**', 'web/fabin-four-workflows/**', 'scripts/site_fabin_experiment.py', 'scripts/build_site.py', '.github/workflows/pages.yml', '.github/workflows/fabin-four-workflows.yml']
  push:
    branches: [main]
    paths: ['experiments/fabin-four-workflows/**', 'web/fabin-four-workflows/**', 'scripts/site_fabin_experiment.py', 'scripts/build_site.py', '.github/workflows/pages.yml', '.github/workflows/fabin-four-workflows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FabinGurung/jp-scheduling-resources-management
          ref: 49f69e76a85eec9737f704691cc69c88aad62818
          path: peers/scheduling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s experiments/fabin-four-workflows -p test_engine.py -v
      - name: Read back the actual Google Docs and Sheets backend
        run: python experiments/fabin-four-workflows/sync_google.py
      - name: Run the shared snapshot through all four adapters and native CPM
        env:
          FABIN_SCHEDULING_CHECKOUT: ${{ github.workspace }}/peers/scheduling
        run: python experiments/fabin-four-workflows/build_public.py /tmp/fabin-public
      - name: Assemble modular LaTeX from the actual Google Doc and numerical results
        run: |
          python experiments/fabin-four-workflows/latex.py --academic /tmp/fabin-experiment-private/academic.json --results /tmp/fabin-public/results.json --out /tmp/fabin-experiment-private/latex
          python scripts/latex/check_modular_project.py /tmp/fabin-experiment-private/latex
      - name: Record exact public experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: fabin-synthetic-four-workflows
          path: /tmp/fabin-public
